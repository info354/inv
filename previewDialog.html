<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background-color: #F5F5F7;
      padding: 14px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.08);
      margin-bottom: 12px;
    }
    .meta-info {
      font-size: 12px;
      color: #1D1D1F;
      line-height: 1.4;
    }
    .meta-info strong {
      color: #FF6B00;
    }
    .btn-send {
      background-color: #FF6B00;
      color: #FFFFFF;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(255,107,0,0.25);
    }
    .btn-send:hover {
      background-color: #E56000;
    }
    .preview-container {
      background: #FFFFFF;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.08);
      overflow: hidden;
      height: 480px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="meta-info">
      <div><strong>To:</strong> <?= recipientEmail ?> | <strong>CC:</strong> <?= ccEmail ?></div>
      <div><strong>Subject:</strong> <?= subject ?></div>
    </div>
    <button class="btn-send" onclick="confirmSend()">🚀 Confirm & Send Email</button>
  </div>

  <div class="preview-container">
    <iframe src="data:text/html;charset=utf-8;base64,<?= base64Html ?>"></iframe>
  </div>

  <script>
    function confirmSend() {
      google.script.run
        .withSuccessHandler(() => {
          alert('📧 Email sent successfully!');
          google.script.host.close();
        })
        .withFailureHandler((err) => alert('Error: ' + err.message))
        .executeActualSend();
    }
  </script>
</body>
</html>
